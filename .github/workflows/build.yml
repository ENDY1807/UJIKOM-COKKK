name: Build Android and Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze 2>&1 | tee analyze.log || true

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --verbose 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "## Android Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E -A 10 -B 2 -i "FAILURE:|BUILD FAILED|What went wrong:|Caused by:|e: |error: " build.log | head -n 120 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 100 lines:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi

      - name: Prepare APK file
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Rasantara-Kasir-Restoran.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Rasantara-Android-APK
          path: Rasantara-Kasir-Restoran.apk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: build/

      - name: Report Build Error to ci-log branch
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-log
          echo "=== DART ANALYZE OUTPUT ===" > ci-error.txt
          head -n 100 analyze.log >> ci-error.txt || true
          echo "" >> ci-error.txt
          echo "=== GREP ERRORS FROM BUILD LOG ===" >> ci-error.txt
          grep -C 4 -i "error:" build.log | head -n 120 >> ci-error.txt || true
          echo "" >> ci-error.txt
          echo "=== GREP FAILURE FROM BUILD LOG ===" >> ci-error.txt
          grep -C 4 -i "failure" build.log | head -n 120 >> ci-error.txt || true
          git add -f ci-error.txt
          git commit -m "ci: android build failure log" || true
          git push -f origin ci-log || true

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Package Windows Bundle into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Rasantara-Windows.zip" -Force

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Rasantara-Windows-Release
          path: Rasantara-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Rasantara-Android-APK
          path: release-files/

      - name: Download Windows Release
        uses: actions/download-artifact@v4
        with:
          name: Rasantara-Windows-Release
          path: release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Rasantara App Release (Latest)"
          body: |
            ### Aplikasi Kasir Restoran Rasantara (Ujikom)

            Silakan unduh aplikasi yang sesuai dengan perangkat Anda:
            - **Android (HP / Tablet)**: Unduh file **`Rasantara-Kasir-Restoran.apk`** (langsung install di HP, tidak perlu diekstrak).
            - **Windows (PC / Laptop)**: Unduh file **`Rasantara-Windows.zip`** lalu ekstrak dan jalankan `kasir_restoran.exe`.
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
